<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>初二华语理解综合测验</title>
<style>
:root{
  --navy:#0e2440; --navy2:#163c66; --cyan:#24b6c8; --gold:#f2b84b;
  --ink:#14202f; --muted:#657286; --line:#dce5ee; --paper:#ffffff;
  --ok:#0f8a5f; --okbg:#e8f7f1; --bad:#c33c43; --badbg:#fff0f1;
  --panel:#f4f8fb;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;color:var(--ink)}
body{
  background:
    radial-gradient(circle at 12% 14%, rgba(36,182,200,.16), transparent 26%),
    radial-gradient(circle at 88% 12%, rgba(242,184,75,.12), transparent 20%),
    linear-gradient(135deg,#081827 0%,#0d2743 44%,#102f4c 100%);
  background-attachment:fixed;
}
.shell{width:min(1060px,94vw);margin:0 auto;padding:26px 0 40px}
.topbar{
  display:flex;justify-content:space-between;align-items:center;gap:14px;
  color:#fff;margin-bottom:18px
}
.brand h1{font-size:24px;margin:0 0 5px;letter-spacing:.04em}
.brand p{margin:0;color:#c8d7e6;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit}
.ghost,.primary{
  border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700
}
.ghost{background:rgba(255,255,255,.08);color:#fff}
.primary{background:var(--cyan);color:#072637;border-color:transparent}
.dashboard{
  display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px
}
.stat{
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);
  backdrop-filter:blur(10px);border-radius:13px;padding:10px 12px;color:white
}
.stat small{display:block;color:#afc4d7;font-size:10px;letter-spacing:.08em}
.stat b{font-size:19px}
.progressWrap{height:8px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;margin:12px 0 18px}
.progress{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),#67d6c0);transition:.25s}
.card{
  background:rgba(255,255,255,.98);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.25);
  overflow:hidden;border:1px solid rgba(255,255,255,.5)
}
.cardHead{padding:18px 22px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:10px;font-weight:800;letter-spacing:.05em;border-radius:999px;padding:4px 9px;background:#e9f6f8;color:#0a6e7a}
.qnum{font-size:11px;color:var(--muted)}
.cardBody{padding:24px 24px 20px}
.question{white-space:pre-line;font-size:21px;line-height:1.65;font-weight:750;min-height:82px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.opt{
  position:relative;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;
  padding:14px 14px 14px 52px;min-height:56px;cursor:pointer;transition:.15s;font-size:14px;line-height:1.45
}
.opt:hover{border-color:#8cbfd0;transform:translateY(-1px);box-shadow:0 7px 20px rgba(23,55,94,.08)}
.opt .letter{
  position:absolute;left:13px;top:12px;width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:#edf3f8;color:#294f70;font-weight:900
}
.opt.correct{background:var(--okbg);border-color:#84cbb0;color:#075c40}
.opt.correct .letter{background:var(--ok);color:white}
.opt.wrong{background:var(--badbg);border-color:#e1a2a7;color:#8d272e}
.opt.wrong .letter{background:var(--bad);color:white}
.opt.disabled{cursor:default;transform:none}
.explain{
  display:none;margin-top:18px;padding:15px 16px;border-radius:12px;background:var(--panel);border-left:4px solid var(--cyan)
}
.explain.show{display:block}
.explain .answer{font-weight:900;color:var(--navy)}
.explain .lesson{display:inline-block;margin-top:8px;padding:3px 8px;border-radius:999px;background:#e8eef6;color:#34506d;font-size:10px;font-weight:800}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}
.next{
  margin-left:auto;border:0;border-radius:10px;background:var(--navy);color:#fff;
  padding:10px 18px;font-weight:800;cursor:pointer
}
.next:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:11px;color:var(--muted)}
.milestones{
  margin-top:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  color:#d7e3ee;border-radius:14px;padding:10px 12px;font-size:11px
}
.milestones span{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.08);margin:3px}
.milestones span.hit{background:var(--gold);color:#3e2c05;font-weight:900}
.result{display:none;padding:34px;text-align:center}
.result.show{display:block}
.result h2{font-size:30px;color:var(--navy);margin:0 0 6px}
.result .scoreBig{font-size:54px;font-weight:900;color:var(--cyan);margin:4px 0}
.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px auto;max-width:720px}
.breakItem{background:#f4f7fa;border:1px solid var(--line);padding:10px;border-radius:10px;font-size:12px}
.toast{
  position:fixed;top:18px;left:50%;transform:translate(-50%,-18px);opacity:0;pointer-events:none;
  background:#071b2c;color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:12px;
  padding:10px 14px;font-weight:800;transition:.25s;z-index:99;box-shadow:0 16px 40px rgba(0,0,0,.28)
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.legend{font-size:10px;color:#b9cbda;margin-top:8px}
.footer{color:#a9bed0;font-size:10px;text-align:center;margin-top:16px}
@media(max-width:760px){
  .dashboard{grid-template-columns:repeat(2,1fr)}
  .options{grid-template-columns:1fr}
  .question{font-size:18px}
  .topbar{align-items:flex-start;flex-direction:column}
  .breakdown{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="shell">
  <div class="topbar">
    <div class="brand">
      <h1>初二华语理解综合测验</h1>
      <p>每轮随机 50 题｜选择题 A–D｜作答后即时题解</p>
    </div>
    <div class="actions">
      <button class="ghost" id="soundBtn">🔊 音效：开</button>
      <button class="primary" id="restartBtn">↻ 新一轮 50 题</button>
    </div>
  </div>

  <div class="dashboard">
    <div class="stat"><small>进度</small><b id="statProgress">1 / 50</b></div>
    <div class="stat"><small>答对</small><b id="statCorrect">0</b></div>
    <div class="stat"><small>答错</small><b id="statWrong">0</b></div>
    <div class="stat"><small>正确率</small><b id="statRate">0%</b></div>
    <div class="stat"><small>题库</small><b>200</b></div>
  </div>

  <div class="progressWrap"><div class="progress" id="progress"></div></div>

  <section class="card" id="quizCard">
    <div class="cardHead">
      <div class="meta">
        <span class="pill" id="catPill">—</span>
        <span class="pill" id="lessonPill">—</span>
      </div>
      <div class="qnum" id="qnum">Question</div>
    </div>
    <div class="cardBody">
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="explain" id="explain"></div>
      <div class="navrow">
        <div class="hint">选择答案后会显示正确答案与简要题解。</div>
        <button class="next" id="nextBtn" disabled>下一题 →</button>
      </div>
    </div>
    <div class="result" id="result"></div>
  </section>

  <div class="milestones">
    答对里程碑音效：
    <span data-m="3">3</span><span data-m="5">5</span><span data-m="10">10</span>
    <span data-m="20">20</span><span data-m="30">30</span>
    <div class="legend">每个里程碑使用不同音效；同一轮只触发一次。</div>
  </div>
  <div class="footer">题目会在每轮随机抽取，选项顺序也会重新打乱。</div>
</div>

<script>
const BANK = [{"id": 1, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "“一根”中的“一”应读作哪一个声调？", "correct": "yì（第四声）", "options": ["yì（第四声）", "yī（第一声）", "yí（第二声）", "轻声 yi"], "explanation": "“一”在第一、二、三声前读第四声。‘根 gēn’是第一声，所以读 yì。"}, {"id": 2, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "“一壶”中的“一”应读作哪一个声调？", "correct": "yì（第四声）", "options": ["yì（第四声）", "yī（第一声）", "yí（第二声）", "轻声 yi"], "explanation": "‘壶 hú’是第二声；“一”在第一、二、三声前读 yì。"}, {"id": 3, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "“一等”中的“一”应读作哪一个声调？", "correct": "yì（第四声）", "options": ["yì（第四声）", "yī（第一声）", "yí（第二声）", "轻声 yi"], "explanation": "‘等 děng’是第三声；“一”在第一、二、三声前读 yì。"}, {"id": 4, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "“一件”中的“一”应读作哪一个声调？", "correct": "yí（第二声）", "options": ["yí（第二声）", "yī（第一声）", "yì（第四声）", "轻声 yi"], "explanation": "‘件 jiàn’是第四声；“一”在第四声前变读第二声 yí。"}, {"id": 5, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "“不多”中的“不”应读作哪一个声调？", "correct": "bù（第四声）", "options": ["bù（第四声）", "bú（第二声）", "轻声 bu", "bū（第一声）"], "explanation": "‘多 duō’是第一声；“不”在非第四声前保持第四声 bù。"}, {"id": 6, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "“不凡”中的“不”应读作哪一个声调？", "correct": "bù（第四声）", "options": ["bù（第四声）", "bú（第二声）", "轻声 bu", "bū（第一声）"], "explanation": "‘凡 fán’是第二声；“不”仍读第四声 bù。"}, {"id": 7, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "“不理”中的“不”应读作哪一个声调？", "correct": "bù（第四声）", "options": ["bù（第四声）", "bú（第二声）", "轻声 bu", "bū（第一声）"], "explanation": "‘理 lǐ’是第三声；“不”仍读第四声 bù。"}, {"id": 8, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "“不错”中的“不”应读作哪一个声调？", "correct": "bú（第二声）", "options": ["bú（第二声）", "bù（第四声）", "轻声 bu", "bū（第一声）"], "explanation": "‘错 cuò’是第四声；“不”在第四声前变读第二声 bú。"}, {"id": 9, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "“试一试”中间的“一”一般读作什么？", "correct": "轻声 yi", "options": ["轻声 yi", "yī（第一声）", "yí（第二声）", "yì（第四声）"], "explanation": "“一”位于重叠结构中间时读轻声，如“试一试”。"}, {"id": 10, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "“来不来”中间的“不”一般读作什么？", "correct": "轻声 bu", "options": ["轻声 bu", "bù（第四声）", "bú（第二声）", "bū（第一声）"], "explanation": "“不”位于重叠结构中间时读轻声，如“来不来”。"}, {"id": 11, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "“第一”中的“一”应怎样读？", "correct": "读原调 yī", "options": ["读原调 yī", "读 yí", "读 yì", "读轻声 yi"], "explanation": "“一”在词尾等特定位置可读原本的第一声，讲义例子是“第一”。"}, {"id": 12, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "“要不”中的“不”应怎样读？", "correct": "读原调 bù", "options": ["读原调 bù", "读 bú", "读轻声 bu", "读 bū"], "explanation": "“不”在“要不”中按讲义读原调 bù。"}, {"id": 13, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "“花啊”中的“啊”读音最接近哪一个？", "correct": "ya（呀）", "options": ["ya（呀）", "wa（哇）", "na（哪）", "ra"], "explanation": "前一音节韵母为 a 时，“啊”发生音变，读作 ya。"}, {"id": 14, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "“好啊”中的“啊”读音最接近哪一个？", "correct": "wa（哇）", "options": ["wa（哇）", "ya（呀）", "na（哪）", "nga"], "explanation": "前一音节以 ao 结尾，按规则“啊”读 wa。"}, {"id": 15, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "“天啊”中的“啊”读音最接近哪一个？", "correct": "na（哪）", "options": ["na（哪）", "ya（呀）", "wa（哇）", "ra"], "explanation": "前一音节以 n 结尾，“啊”读 na。"}, {"id": 16, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "“望啊”中的“啊”读音最接近哪一个？", "correct": "nga", "options": ["nga", "na（哪）", "ya（呀）", "za"], "explanation": "前一音节以 ng 结尾，“啊”读 nga。"}, {"id": 17, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "“孩子啊”中的“啊”读音最接近哪一个？", "correct": "za", "options": ["za", "ya（呀）", "wa（哇）", "ra"], "explanation": "zi、ci、si 后面的“啊”按讲义读 za。"}, {"id": 18, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "“事啊”中的“啊”读音最接近哪一个？", "correct": "ra", "options": ["ra", "za", "na（哪）", "wa（哇）"], "explanation": "zhi、chi、shi、ri、er 后面的“啊”按讲义读 ra。"}, {"id": 19, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "下列哪一项最符合“轻声”的特点？", "correct": "又轻又短，没有固定调号", "options": ["又轻又短，没有固定调号", "声音特别高而长", "一定读第一声", "一定出现在名词前"], "explanation": "轻声的核心特点是读得轻、短，并没有固定调号。"}, {"id": 20, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "下列哪一组属于讲义中常读轻声的结构助词？", "correct": "的、地、得、着、了、过", "options": ["的、地、得、着、了、过", "和、与、或、但是", "你、我、他、她", "在、从、向、往"], "explanation": "讲义列出的结构助词“的、地、得、着、了、过”常读轻声。"}, {"id": 21, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "“教室里”中的“里”为什么常读轻声？", "correct": "它是名词后面的方位词", "options": ["它是名词后面的方位词", "它是量词", "它是成语的一部分", "它是反问词"], "explanation": "名词、代词后面的方位词如“里、上、下、边”等常读轻声。"}, {"id": 22, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "“妹妹”中的第二个“妹”为什么常读轻声？", "correct": "重叠名词的第二个音节常轻读", "options": ["重叠名词的第二个音节常轻读", "因为它是第四声", "因为它是方位词", "因为它后面有标点"], "explanation": "讲义指出，名词或动词重叠时，后一个音节常读轻声。"}, {"id": 23, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "下列哪一项最符合“孩子”中“子”的轻声条件？", "correct": "“子”作为没有实质意义的词尾", "options": ["“子”作为没有实质意义的词尾", "“子”表示古代老师", "“子”是句子主语", "所有“子”字都必须轻读"], "explanation": "“子、头、么、们、儿”等作为无实义词尾时常读轻声；有实质含义时不一定轻读。"}, {"id": 24, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "“号码儿”的拼音写法按笔记应是哪一个？", "correct": "hào mǎr", "options": ["hào mǎr", "hào mǎ er", "hào mǎng", "hào mǎn"], "explanation": "儿化时“儿”并非单独成音节；讲义例子“号码儿”写作 hào mǎr。"}, {"id": 25, "category": "汉语拼音", "lesson": "汉语拼音", "prompt": "“一点儿”的拼音写法按笔记应是哪一个？", "correct": "yì diǎnr", "options": ["yì diǎnr", "yí diǎn er", "yì diǎng", "yī diǎnr"], "explanation": "末尾 n 在儿化中按讲义处理后写作 r，因此“一点儿”写作 yì diǎnr。"}, {"id": 26, "category": "词的感情色彩", "lesson": "词的感情色彩", "prompt": "“创新”一般属于哪一种感情色彩？", "correct": "褒义词", "options": ["褒义词", "中性词", "贬义词", "无法判断"], "explanation": "“创新”通常带有肯定、赞扬的意味，属于褒义词。"}, {"id": 27, "category": "词的感情色彩", "lesson": "词的感情色彩", "prompt": "“和谐”一般属于哪一种感情色彩？", "correct": "褒义词", "options": ["褒义词", "中性词", "贬义词", "无法判断"], "explanation": "“和谐”通常表达正面、肯定的状态，属于褒义词。"}, {"id": 28, "category": "词的感情色彩", "lesson": "词的感情色彩", "prompt": "“温文尔雅”一般属于哪一种感情色彩？", "correct": "褒义词", "options": ["褒义词", "中性词", "贬义词", "无法判断"], "explanation": "“温文尔雅”用于称赞人的举止文雅，带明显褒义。"}, {"id": 29, "category": "词的感情色彩", "lesson": "词的感情色彩", "prompt": "“大显身手”一般属于哪一种感情色彩？", "correct": "褒义词", "options": ["褒义词", "中性词", "贬义词", "无法判断"], "explanation": "“大显身手”指充分展现本领，通常带肯定和赞赏。"}, {"id": 30, "category": "词的感情色彩", "lesson": "词的感情色彩", "prompt": "“结果”一般属于哪一种感情色彩？", "correct": "中性词", "options": ["中性词", "褒义词", "贬义词", "讽刺词" "谚语和歇后语", "lesson": "谚语", "prompt": "下面情境最适合用哪一句谚语？\n职业不分高低，只要专心钻研，也能成为专业人才。", "correct": "三百六十行，行行出状元", "options": ["三百六十行，行行出状元", "若要人不知，除非己莫为", "有志者事竟成", "路遥知马力，日久见人心"], "explanation": "“三百六十行，行行出状元”的意思是：任何行业认真钻研都能有所成就。 这个情境与它的核心道理最吻合。"}, {"id": 83, "category": "谚语和歇后语", "lesson": "谚语", "prompt": "下面情境最适合用哪一句谚语？\n训练虽然辛苦，但运动员仍每天坚持。", "correct": "吃得苦中苦，方为人上人", "options": ["吃得苦中苦，方为人上人", "一寸光阴一寸金", "人无远虑，必有近忧", "近朱者赤，近墨者黑"], "explanation": "“吃得苦中苦，方为人上人”的意思是：能经受艰苦磨炼，才更可能取得成就。 这个情境与它的核心道理最吻合。"}, {"id": 84, "category": "谚语和歇后语", "lesson": "谚语", "prompt": "下面情境最适合用哪一句谚语？\n比赛受伤后，他先治疗休养，准备康复后再重新训练。", "correct": "留得青山在，不怕没柴烧", "options": ["留得青山在，不怕没柴烧", "有志者事竟成", "路遥知马力，日久见人心", "不经一事，不长一智"], "explanation": "“留得青山在，不怕没柴烧”的意思是：只要根本条件仍在，未来仍有机会。 这个情境与它的核心道理最吻合。"}, {"id": 85, "category": "谚语和歇后语", "lesson": "谚语", "prompt": "下面情境最适合用哪一句谚语？\n不要抱着侥幸心理做不该做的事。", "correct": "若要人不知，除非己莫为", "options": ["若要人不知，除非己莫为", "人无远虑，必有近忧", "近朱者赤，近墨者黑", "三百六十行，行行出状元"], "explanation": "“若要人不知，除非己莫为”的意思是：做过的事很难永远隐瞒。 这个情境与它的核心道理最吻合。"}, {"id": 86, "category": "谚语和歇后语", "lesson": "歇后语", "prompt": "下面情境最适合用哪一句歇后语？\n这名骗子恶行曝光后，到处受到责骂和排斥。", "correct": "老鼠过街——人人喊打", "options": ["老鼠过街——人人喊打", "竹篮打水——一场空", "十五个吊桶打水——七上八下", "外甥打灯笼——照舅（旧）"], "explanation": "“老鼠过街——人人喊打”的意思是：坏人坏事受到大家厌恶。 题目情境正好符合这个意思。"}, {"id": 87, "category": "谚语和歇后语", "lesson": "歇后语", "prompt": "下面情境最适合用哪一句歇后语？\n他明明受了委屈，却因为没有证据，只能把苦闷藏在心里。", "correct": "哑巴吃黄连——有苦说不出", "options": ["哑巴吃黄连——有苦说不出", "姜太公钓鱼——愿者上钩", "黄鼠狼给鸡拜年——没安好心", "猫哭耗子——假慈悲"], "explanation": "“哑巴吃黄连——有苦说不出”的意思是：心里有苦，却无法说明。 题目情境正好符合这个意思。"}, {"id": 88, "category": "谚语和歇后语", "lesson": "歇后语", "prompt": "下面情境最适合用哪一句歇后语？\n他没保存文件，做了一晚的报告因电脑故障全部丢失。", "correct": "竹篮打水——一场空", "options": ["竹篮打水——一场空", "十五个吊桶打水——七上八下", "外甥打灯笼——照舅（旧）", "泥菩萨过江——自身难保"], "explanation": "“竹篮打水——一场空”的意思是：辛苦一番却毫无结果。 题目情境正好符合这个意思。"}, {"id": 89, "category": "谚语和歇后语", "lesson": "歇后语", "prompt": "下面情境最适合用哪一句歇后语？\n活动公开说明规则，愿意参加的人自己报名。", "correct": "姜太公钓鱼——愿者上钩", "options": ["姜太公钓鱼——愿者上钩", "黄鼠狼给鸡拜年——没安好心", "猫哭耗子——假慈悲", "  118, "category": "修辞", "lesson": "修辞辨认", "prompt": "下列句子主要运用了哪一种修辞？\n老师常提醒我们：“有志者事竟成。”", "correct": "引用", "options": ["引用", "夸张", "设问", "顶真"], "explanation": "直接引用固定语句来说明坚持的重要。"}, {"id": 119, "category": "修辞", "lesson": "修辞辨认", "prompt": "下列句子主要运用了哪一种修辞？\n正所谓“近朱者赤，近墨者黑”，交友环境确实会影响一个人。", "correct": "引用", "options": ["引用", "借代", "反问", "回文"], "explanation": "引用谚语支持观点。"}, {"id": 120, "category": "修辞", "lesson": "修辞辨认", "prompt": "下列句子主要运用了哪一种修辞？\n“人无远虑，必有近忧”提醒我们做事要有长远打算。", "correct": "引用", "options": ["引用", "设问", "顶真", "比喻"], "explanation": "引用熟语作为论据，属于引用。"}, {"id": 121, "category": "修辞", "lesson": "修辞辨认", "prompt": "下列句子主要运用了哪一种修辞？\n什么是真正的勇敢？是在困难面前仍愿意承担责任。", "correct": "设问", "options": ["设问", "反问", "回文", "比拟"], "explanation": "先提出问题，再自己回答，用来引出重点。"}, {"id": 122, "category": "修辞", "lesson": "修辞辨认", "prompt": "下列句子主要运用了哪一种修辞？\n谁是这场活动最辛苦的人？当然是一直默默准备的工作人员。", "correct": "设问", "options": ["设问", "顶真", "比喻", "夸张"], "explanation": "问句之后马上作答，是典型自问自答。"}, {"id": 123, "category": "修辞", "lesson": "修辞辨认", "prompt": "下列句子主要运用了哪一种修辞？\n我们为什么要阅读？因为阅读能开阔视野。", "correct": "设问", "options": ["设问", "回文", "比拟", "借代"], "explanation": "先问后答，目的是引起注意并引出答案。"}, {"id": 124, "category": "修辞", "lesson": "修辞辨认", "prompt": "下列句子主要运用了哪一种修辞？\n怎样才能减少粗心？先检查题目要求，再逐项核对。", "correct": "设问", "options": ["设问", "比喻", "夸张", "引用"], "explanation": "提出问题后紧接答案，属于设问。"}, {"id": 125, "category": "修辞", "lesson": "修辞辨认", "prompt": "下列句子主要运用了哪一种修辞？\n难道我们不应该珍惜这次机会吗？", "correct": "反问", "options": ["反问", "比拟", "借代", "设问"], "explanation": "用疑问形式表达肯定意思：我们应该珍惜。"}, {"id": 126, "category": "修辞", "lesson": "修辞辨认", "prompt": "下列句子主要运用了哪一种修辞？\n这样的错误，难道还能一犯再犯吗？", "correct": "反问", "options": ["反问", "夸张", "引用", "顶真"], "explanation": "表面问句，实际表达“不应该再犯”的确定态度。"}, {"id": 127, "category": "修辞", "lesson": "修辞辨认", "prompt": "下列句子主要运用了哪一种修辞？\n时间这么宝贵，我们怎能随意浪费呢？", "correct": "反问", "options": ["反问", "借代", "设问", "回文"], "explanation": "用问句加强否定语气：不能浪费时间。"}, {"id": 128, "category": "修辞", "lesson": "修辞辨认", "prompt": "下列句子主要运用了哪一种修辞？\n面对同伴求助，我们难道可以袖手旁观吗？", "c const state = {
  round: [],
  index: 0,
  correct: 0,
  wrong: 0,
  answered: false,
  sound: true,
  hitMilestones: new Set(),
  categoryStats: {}
};

const $ = s => document.querySelector(s);
const letters = ["A","B","C","D"];

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startRound(){
  state.round = shuffle(BANK).slice(0,50).map(q => ({...q, options:shuffle(q.options)}));
  state.index = 0; state.correct=0; state.wrong=0; state.answered=false;
  state.hitMilestones = new Set(); state.categoryStats={};
  document.querySelectorAll(".milestones span").forEach(x=>x.classList.remove("hit"));
  $("#result").classList.remove("show");
  $(".cardBody").style.display = "";
  render();
}

function render(){
  const q = state.round[state.index];
  state.answered = false;
  $("#catPill").textContent = q.category;
  $("#lessonPill").textContent = q.lesson;
  $("#qnum").textContent = `第 ${state.index+1} 题 / 50`;
  $("#question").textContent = q.prompt;
  $("#explain").className = "explain";
  $("#explain").innerHTML = "";
  $("#nextBtn").disabled = true;
  $("#nextBtn").textContent = state.index===49 ? "查看成绩 →" : "下一题 →";
  const box = $("#options");
  box.innerHTML = "";
  q.options.forEach((opt,i)=>{
    const b=document.createElement("button");
    b.className="opt";
    b.innerHTML=`<span class="letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    b.addEventListener("click",()=>answer(opt,b));
    box.appendChild(b);
  });
  updateStats();
}

function answer(opt, btn){
  if(state.answered) return;
  state.answered = true;
  const q = state.round[state.index];
  const isCorrect = opt===q.correct;
  if(!state.categoryStats[q.category]) state.categoryStats[q.category]={c:0,t:0};
  state.categoryStats[q.category].t++;
  if(isCorrect){
    state.correct++;
    state.categoryStats[q.category].c++;
    btn.classList.add("correct");
    playBasic(true);
    checkMilestone();
  }else{
    state.wrong++;
    btn.classList.add("wrong");
    playBasic(false);
  }

  [...document.querySelectorAll(".opt")].forEach(b=>{
    b.classList.add("disabled");
    b.disabled = true;
    const txt = b.querySelector("span:last-child").textContent;
    if(txt===q.correct) b.classList.add("correct");
  });

  $("#explain").innerHTML =
    `<div class="answer">${isCorrect ? "✓ 回答正确" : "✗ 回答错误"}｜正确答案：${escapeHtml(q.correct)}</div>
     <div style="margin-top:7px">${escapeHtml(q.explanation)}</div>
     <span class="lesson">考点：${escapeHtml(q.lesson)}</span>`;
  $("#explain").classList.add("show");
  $("#nextBtn").disabled = false;
  updateStats();
}

function next(){
  if(!state.answered) return;
  if(state.index>=49){ showResult(); return; }
  state.index++;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function updateStats(){
  const done = state.correct + state.wrong;
  $("#statProgress").textContent = `${Math.min(state.index+1,50)} / 50`;
  $("#statCorrect").textContent = state.correct;
  $("#statWrong").textContent = state.wrong;
  $("#statRate").textContent = done ? Math.round(state.correct/done*100)+"%" : "0%";
  $("#progress").style.width = `${done/50*100}%`;
}

function showResult(){
  $(".cardBody").style.display = "none";
  const r=$("#result");
  r.classList.add("show");
  const pct=Math.round(state.correct/50*100);
  const rows=Object.entries(state.categoryStats)
    .sort((a,b)=>a[0].localeCompare(b[0],"zh"))
    .map(([cat,v])=>`<div class="breakItem"><b>${escapeHtml(cat)}</b><br>${v.c} / ${v.t} 正确</div>`).join("");
  r.innerHTML=`
    <h2>本轮完成</h2>
    <div class="scoreBig">${state.correct} / 50</div>
    <div>正确率 ${pct}%</div>
    <div class="breakdown">${rows}</div>
    <button class="primary" onclick="startRound()">再来一轮随机 50 题</button>`;
  $("#progress").style.width="100%";
}

function checkMilestone(){
  const m=[3,5,10,20,30].find(x=>x===state.correct && !state.hitMilestones.has(x));
  if(!m) return;
  state.hitMilestones.add(m);
  const el=document.querySelector(`.milestones span[data-m="${m}"]`);
  if(el) el.classList.add("hit");
  playMilestone(m);
  showToast(`🎯 已答对 ${m} 题`);
}

function showToast(txt){
  const t=$("#toast");
  t.textContent=txt;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1300);
}

let audioCtx=null;
function ctx(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function tone(freq,start,dur,type="sine",gain=.055){
  if(!state.sound) return;
  const c=ctx(),o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0.0001,c.currentTime+start);
  g.gain.exponentialRampToValueAtTime(gain,c.currentTime+start+.01);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+start+dur);
  o.connect(g);g.connect(c.destination);
  o.start(c.currentTime+start);o.stop(c.currentTime+start+dur+.02);
}
function playBasic(ok){
  if(!state.sound) return;
  if(ok){tone(660,0,.08,"sine",.025);}
  else{tone(180,0,.10,"triangle",.025);}
}
function playMilestone(m){
  if(!state.sound) return;
  const patterns={
    3:[[523,0,.13]],
    5:[[587,0,.10],[784,.12,.14]],
    10:[[523,0,.09],[659,.10,.09],[784,.20,.16]],
    20:[[392,0,.08],[523,.09,.08],[659,.18,.08],[784,.27,.18]],
    30:[[523,0,.09],[659,.09,.09],[784,.18,.09],[1047,.27,.23],[784,.52,.12]]
  };
  (patterns[m]||[]).forEach(x=>tone(x[0],x[1],x[2],"sine",.07));
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}

$("#nextBtn").addEventListener("click",next);
$("#restartBtn").addEventListener("click",()=>{ if(confirm("确定开始新一轮随机 50 题吗？")) startRound(); });
$("#soundBtn").addEventListener("click",()=>{
  state.sound=!state.sound;
  $("#soundBtn").textContent=state.sound ? "🔊 音效：开" : "🔇 音效：关";
});

startRound();
</script>
</body>
</html>
